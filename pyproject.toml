[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medplat-ingestion"
version = "0.1.0"
description = "MedPlat: course-library extraction, cataloging, and source-grounded lesson pipeline"
requires-python = ">=3.11"
dependencies = [
    "docling",
    "pymupdf",
    "pydantic",
    "typer",
    "rich",
    "anthropic>=1.15",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
medparse = "ingestion.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ingestion"]
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
    "docling",
    "docling.*",
    "docling_core",
    "docling_core.*",
    "fitz",
    "pymupdf",
    "numpy",
    "numpy.*",
]
follow_imports = "skip"

[tool.ruff.lint.isort]
# Python 3.11+ stdlib module; lint target stays py310 to avoid enum/datetime rewrites.
extra-standard-library = ["tomllib"]
